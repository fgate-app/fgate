services:
  freedomgate:
    build:
      context: .
    image: freedomgate:local
    container_name: freedomgate
    # Full gateway mode manages host interfaces, TUN, DHCP and nftables.
    # Run on a dedicated Linux gateway, never Docker Desktop or rootless Docker.
    privileged: true
    network_mode: host
    cgroup: host
    restart: unless-stopped
    stop_grace_period: 30s
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - state:/var/lib/freedomgate
      - modules:/opt/freedomgate/modules
      - module-updates:/opt/freedomgate/module-updates
volumes:
  state:
  modules:
  module-updates:
