<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101318"><link rel="stylesheet" href="/typography.css"><link rel="stylesheet" href="/colors.css"><title>FreedomGate</title><style>
:root{color-scheme:dark;--space-3:12px;--space-4:16px;--space-6:24px;--radius-control:8px;--background:var(--color-page);--text:var(--color-text-primary);--muted:var(--color-text-secondary);--button:var(--color-accent-selected);--accent:var(--color-accent-strong);font-family:system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--background);color:var(--text);padding:var(--space-6)}main{max-width:420px;display:grid;justify-items:center;gap:var(--space-4);text-align:center}img{width:80px;height:80px;border-radius:var(--radius-control)}h1{font-size:var(--font-size-20);margin:0}p{font-size:var(--font-size-14);line-height:1.5;color:var(--muted);margin:0}button{font:inherit;font-size:var(--font-size-body);min-height:44px;padding:var(--space-3) var(--space-6);border:0;border-radius:var(--radius-control);background:var(--button);color:var(--accent);cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
</style></head><body><main><img src="/icons/icon-192.png" alt="FreedomGate"><h1 id="title">FreedomGate is unavailable</h1><p id="message">Check your connection to FreedomGate and try again.</p><button id="retry" type="button">Try again</button></main><script>
let locale='en';try{locale=localStorage.getItem('fg.locale') || 'en';document.documentElement.dataset.theme=localStorage.getItem('fg.theme')==='light'?'light':'dark';}catch{}
const messages={en:['FreedomGate is unavailable','Check your connection to FreedomGate and try again.','Try again'],ru:['Нет соединения с FreedomGate','Проверьте подключение к FreedomGate и повторите попытку.','Повторить'],'zh-CN':['无法连接 FreedomGate','请检查与 FreedomGate 的连接，然后重试。','重试']};
const text=messages[locale] || messages.en;document.documentElement.lang=messages[locale]?locale:'en';['title','message','retry'].forEach((id,index)=>document.getElementById(id).textContent=text[index]);document.getElementById('retry').addEventListener('click',()=>location.reload());window.addEventListener('online',()=>location.reload());
</script></body></html>
